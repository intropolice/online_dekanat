services:
  web:
    build:
      context: .
    image: online-dekanat:local
    ports:
      - "${ONLINE_DEKANAT_PORT:-8000}:8000"
    environment:
      ONLINE_DEKANAT_STORAGE_KEY: ${ONLINE_DEKANAT_STORAGE_KEY:-}
    volumes:
      - app_data:/app/data
      - ./results.json:/app/results.json
      - paddle_models:/home/app/.paddle
      - paddlex_models:/home/app/.paddlex
      - paddleocr_models:/home/app/.paddleocr
      - easyocr_models:/home/app/.EasyOCR
      - torch_cache:/home/app/.cache/torch
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_data:
  paddle_models:
  paddlex_models:
  paddleocr_models:
  easyocr_models:
  torch_cache:
