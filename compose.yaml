services:
  web:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-mirror.gcr.io/library/python:3.11-slim-bookworm}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://mirror.yandex.ru/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://mirror.yandex.ru/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: online-dekanat:local
    ports:
      - "${ONLINE_DEKANAT_PORT:-8000}:8000"
    environment:
      ONLINE_DEKANAT_STORAGE_KEY: ${ONLINE_DEKANAT_STORAGE_KEY:-}
      ONLINE_DEKANAT_RESULTS_PATH: /app/data/results.json
      ONLINE_DEKANAT_HTTPS_ONLY: ${ONLINE_DEKANAT_HTTPS_ONLY:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Онлайн-деканат}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
    volumes:
      - app_data:/app/data
      - ./results.json:/app/data/results.json
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_data:
