[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "online-dekanat"
version = "0.1.0"
description = "OCR + field extraction + grounded answers for a digital dean office assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hackathon team" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pillow>=10.0",
  "pymupdf>=1.24",
  "cryptography>=43.0"
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.13"]
easyocr = ["easyocr>=1.7.2", "numpy>=1.26"]
paddleocr = ["paddleocr>=2.9.1; python_version < '3.14'", "paddlepaddle>=3.0.0; python_version < '3.14'", "numpy>=1.26"]
ocr = ["pytesseract>=0.3.13", "easyocr>=1.7.2", "numpy>=1.26", "paddleocr>=2.9.1; python_version < '3.14'", "paddlepaddle>=3.0.0; python_version < '3.14'"]
dataset = ["datasets>=2.20"]
dev = ["pytest>=8.0"]

[project.scripts]
online-dekanat = "online_dekanat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "src.online_dekanat.api:app"
